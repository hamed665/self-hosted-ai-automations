services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: n8n
      POSTGRES_DB: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a fresh local password}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U n8n -d n8n']
      interval: 5s
      retries: 20
    networks: [internal]
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.43.8
    ports: ['127.0.0.1:5678:5678']
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Generate a fresh local password}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Generate a fresh local key}
      N8N_USER_MANAGEMENT_JWT_SECRET: ${N8N_USER_MANAGEMENT_JWT_SECRET:?Generate a fresh local secret}
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_SECURE_COOKIE: 'false'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/portfolio-workflows:ro
    networks: [internal]
  ollama:
    image: ollama/ollama:0.40.6
    volumes: [ollama_data:/root/.ollama]
    networks: [internal, model_download]
    mem_limit: 6g
networks:
  internal:
    internal: true
  model_download: {}
volumes:
  postgres_data: {}
  n8n_data: {}
  ollama_data: {}
